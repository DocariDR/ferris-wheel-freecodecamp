<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- SEO basics -->
        <title>Ferris Wheel — Pure CSS Animation Demo</title>
        <meta name="description" content="A pure CSS animated Ferris wheel with six hanging cabins. Lightweight, dependency-free, and accessible (pause control + reduced-motion support).">
        <meta name="author" content="Ferris Wheel demo">
        <meta name="theme-color" content="#0f172a">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Ferris Wheel — Pure CSS Animation Demo">
        <meta property="og:description" content="A pure CSS animated Ferris wheel with six hanging cabins — lightweight, accessible, dependency-free.">
        <!-- TODO: replace with your real URL before deploying -->
        <!-- <meta property="og:url" content="https://votre-domaine.example/ferris-wheel/"> -->

        <!-- Twitter card -->
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="Ferris Wheel — Pure CSS Animation Demo">
        <meta name="twitter:description" content="A pure CSS animated Ferris wheel with six hanging cabins — lightweight, accessible, dependency-free.">

        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <main>
            <h1>Ferris Wheel</h1>
            <p class="sr-only">An animated Ferris wheel with six hanging cabins, rotating continuously. Use the Pause button to stop the motion at any time.</p>
            <div class="wheel" role="img" aria-label="Animated Ferris wheel with six cabins">
                <span class="line" style="--angle: 0deg"></span>
                <span class="line" style="--angle: 60deg"></span>
                <span class="line" style="--angle: 120deg"></span>
                <span class="line" style="--angle: 180deg"></span>
                <span class="line" style="--angle: 240deg"></span>
                <span class="line" style="--angle: 300deg"></span>

                <div class="cabin-wrap" style="--angle: 270deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 210deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 150deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 90deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 30deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 330deg"><div class="cabin"></div></div>
            </div>

            <div class="controls">
                <button id="toggleMotion" type="button" aria-pressed="false">
                    <span class="btn-label">Pause</span>
                </button>
            </div>
        </main>

        <script src="./script.js" defer></script>
    </body>
</html>
