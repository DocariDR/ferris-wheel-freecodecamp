<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ferris Wheel</title>
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <main>
            <h1>Ferris Wheel</h1>
            <div class="wheel" role="img" aria-label="Animated Ferris wheel with six cabins">
                <!-- Six spokes (radii) -->
                <span class="line" style="--angle: 0deg"></span>
                <span class="line" style="--angle: 60deg"></span>
                <span class="line" style="--angle: 120deg"></span>
                <span class="line" style="--angle: 180deg"></span>
                <span class="line" style="--angle: 240deg"></span>
                <span class="line" style="--angle: 300deg"></span>

                <div class="cabin-wrap" style="--angle: 270deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 210deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 150deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 90deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 30deg"><div class="cabin"></div></div>
                <div class="cabin-wrap" style="--angle: 330deg"><div class="cabin"></div></div>
            </div>

            <div class="controls">
                <button id="toggleMotion" type="button" aria-pressed="false">
                    <span class="btn-label">Pause</span>
                </button>
            </div>
        </main>

        <script src="./script.js" defer></script>
    </body>
</html>
